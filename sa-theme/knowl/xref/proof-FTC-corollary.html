<article class="proof"><h4 class="heading"><span class="type">Proof</span></h4>
<div class="para logical">
<div class="para">We simply take the indicated derivative, applying Theorem <a href="#theorem-FTC" class="xref" data-knowl="./knowl/xref/theorem-FTC.html" data-reveal-label="Reveal" data-close-label="Close" title="Theorem 1.1: The Fundamental Theorem of Calculus">1.1</a> at <a href="#proof-FTC-corollary-1-4" class="xref" data-knowl="./knowl/xref/equation-use-FTC.html" data-reveal-label="Reveal" data-close-label="Close" title="Equation 3.2">(3.2)</a>
</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/xref/theorem-FTC.html ./knowl/xref/equation-use-FTC.html">
\begin{align}
\frac{d}{dx}\definiteintegral{a}{x}{f(t)}{t}&amp;=\frac{d}{dx}\left(F(x)-F(a)\right)\tag{3.2}\\
&amp;=\frac{d}{dx}F(x)-\frac{d}{dx}F(a)\notag\\
&amp;=f(x)-0 = f(x)\text{.}\tag{3.3}
\end{align}
</div>
