<div class="para logical">
<div class="para">Given sets <span class="process-math">\(A\)</span> and <span class="process-math">\(B\text{,}\)</span> we can define a new set <span class="process-math">\(A \times B\text{,}\)</span> called the <dfn class="terminology">Cartesian product</dfn>  of <span class="process-math">\(A\)</span> and <span class="process-math">\(B\text{,}\)</span> as a set of ordered pairs.  That is, </div>
<div class="displaymath process-math">
\begin{equation*}
A \times B = \{ (a,b) : a \in A \text{ and } b \in B \}\text{.}
\end{equation*}
</div>
